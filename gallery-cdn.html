<!doctype html>
<html lang="en">

<head>
  <title>Light Gallery</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="https://unpkg.com/litelight-js@1.2.0/dist/lite-light.min.css">
  <script type="module">
    import { init } from 'https://unpkg.com/litelight-js@1.2.0/dist/lite-light.min.js';
    init();
  </script>
</head>

<body>
  <header>
    <h1>Glacier National Park</h1>
  </header>
  <main>
    <div class="gallery">
      <img src="images/thumb/gnp01.jpg" data-lightbox="images/gnp01.jpg" alt="Many Glacier" />
      <img src="images/thumb/gnp02.jpg" data-lightbox="images/gnp02.jpg" alt="Many Glacier- Aspen Grove" />
      <img src="images/thumb/gnp03.jpg" data-lightbox="images/gnp03.jpg" alt="Logan Pass- Aster Bloom" />
      <img src="images/thumb/gnp04.jpg" data-lightbox="images/gnp04.jpg"
        alt="Hidden Lake- August Evening With The Goats" />
      <img src="images/thumb/gnp05.jpg" data-lightbox="images/gnp05.jpg" alt="Lake McDonald" />
      <img src="images/thumb/gnp06.jpg" data-lightbox="images/gnp06.jpg" alt="Sun Road- Blending In On A Blue Day" />
      <img src="images/thumb/gnp07.jpg" data-lightbox="images/gnp07.jpg"
        alt="Avalanche Lake- Last Light Before Winter" />
      <img src="images/thumb/gnp08.jpg" data-lightbox="images/gnp08.jpg" alt="Windy Wild Goose Island Overlook" />
      <img src="images/thumb/gnp09.jpg" data-lightbox="images/gnp09.jpg" alt="Saint Mary Lake Shoreline" />
    </div>
  </main>
  <footer>
    <p><a href="./">Examples</a> are from <a href="https://cs12.net/">CSCI E-12</a>, <a
        href="https://extension.harvard.edu/">Harvard Extension School</a></p>
    <p>Images are public domain from <a href="https://www.flickr.com/photos/glaciernps/with/23095638434/">Glacier
        National Parker photostream on Flickr</a></p>
  </footer>
</body>

</html>
